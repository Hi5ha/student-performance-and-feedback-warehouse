<!DOCTYPE html>
<html>
<head>
    <title>Student Warehouse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<style>
    /* Navbar Styling */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #007BFF;
    padding: 12px 25px;
    border-radius: 6px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: white;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.nav-links li a {
    text-decoration: none;
    color: white;
    font-weight: 500;
    transition: color 0.3s ease;
}

.nav-links li a:hover {
    color: #FFD700; /* gold hover effect */
}

</style>
<body>
    <nav class="navbar">
    <div class="logo"> Student Warehouse</div>
    <ul class="nav-links">
        <li><a href="{{ url_for('index') }}">Home</a></li>
        <li><a href="{{ url_for('add') }}">Add Record</a></li>
        <li><a href="{{ url_for('analytics') }}">Analytics</a></li>
    </ul>
</nav>
<hr>

    {% block content %}{% endblock %}
</body>
</html>
